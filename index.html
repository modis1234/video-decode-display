<!DOCTYPE html>
<html>
  <head>
    <link rel="stylesheet" href="style.css" />

    <title>WebCodec MP4 decode sample</title>
  </head>
  <body>
    <p>
      Renderer:
      <label for="renderer_2d">

      </label>
      <label for="renderer_webgl">
        <input
          id="renderer_webgl"
          type="radio"
          name="renderer"
          value="webgl"
          checked
        />
        WebGL
      </label>
      <!-- <label for="renderer_webgl2">
        <input
          id="renderer_webgl2"
          type="radio"
          name="renderer"
          value="webgl2"
        />
        WebGL 2
      </label>
      <label for="renderer_webgpu">
        <input
          id="renderer_webgpu"
          type="radio"
          name="renderer"
          value="webgpu"
        />
        WebGPU
      </label> -->
    </p>

    <p>
      Video Codec:
      <label for="video_codec_h264">
        <input
          id="video_codec_h264"
          type="radio"
          name="video_codec"
          value="avc"
          checked
        />
        H.264
      </label>
      <!-- <label for="video_codec_h265">
        <input
          id="video_codec_h265"
          type="radio"
          name="video_codec"
          value="hevc"
        />
        H.265
      </label>
      <label for="video_codec_vp8">
        <input
          id="video_codec_vp8"
          type="radio"
          name="video_codec"
          value="vp8"
        />
        VP8
      </label>
      <label for="video_codec_vp9">
        <input
          id="video_codec_vp9"
          type="radio"
          name="video_codec"
          value="vp9"
        />
        VP9
      </label>
      <label for="video_codec_av1">
        <input
          id="video_codec_av1"
          type="radio"
          name="video_codec"
          value="av1"
        />
        AV1
      </label> -->
    </p>

    <p>
      <button id="start">Start</button>
    </p>
    <div>
      <button onclick="playVideo()">Play</button>
      <button onclick="pause()">Pause</button>
      <button onclick="reset()">Reset</button>
      <button onclick="seek(-10)">-10s</button>
      <button onclick="seek(10)">+10s</button>
      <button disabled onclick="playbackRate(0.5)">x0.5</button>
      <button disabled onclick="playbackRate(1)">x1</button>
      <button disabled onclick="playbackRate(2)">x2</button>
      <button disabled onclick="playbackRate(4)">x4</button>
      <button disabled onclick="playbackRate(8)">x8</button>
      <button disabled onclick="playbackRate(16)">x16</button>
      <input
        type="range"
        id="seekBar"
        min="0"
        max="100"
        value="0"
        step="1"
        onchange="seek(this.value)"
        disabled
      />
      <button onclick="zoneSetting()">영역 설정</button>

      <button onclick="setText()">텍스트 추가</button>
    </div>
    <table cellspacing="8" id="status_table">
      <tr>
        <th align="right">Fetch</th>
        <td id="fetch">Not started</td>
      </tr>
      <tr>
        <th align="right">Demux</th>
        <td id="demux">Not started</td>
      </tr>
      <tr>
        <th align="right">Decode</th>
        <td id="decode">Not started</td>
      </tr>
      <tr>
        <th align="right">Render</th>
        <td id="render">Not started</td>
      </tr>
      <tr>
        <th align="right">Status</th>
        <td id="status">-</td>
      </tr>
    </table>

    <div
      class="video-container"
      style="position: relative; width: 1650px; height: 900px"
    >
      <canvas style="object-fit: contain" id="video"></canvas>
      <canvas
        style="display: block; position: absolute; top: 0; left: 0"
        id="caption"
        width="1650"
        height="900"
      ></canvas>
      <canvas
        id="mosaic"
        style="display: none; position: absolute; top: 0; left: 0"
      ></canvas>
    </div>
    <div class="track-container">
      <div id="track-box"></div>
    </div>

    <script>
      let isTextDragging = false;
      let textOffsetX = 0;
      let textOffsetY = 0;
      // const videoTimestamp = 48.76; // 48.76초
      const videoTimestamp = 53.52; // 53.52초

      // const filePaths = [
      //   "track/JB00000184_1_tracking.txt",
      //   "track/JB00000184_2_tracking.txt",
      //   "track/JB00000184_3_tracking.txt",
      //   "track/JB00000184_4_tracking.txt",
      //   "track/JB00000184_5_tracking.txt",
      //   "track/JB00000184_6_tracking.txt",
      //   "track/JB00000184_7_tracking.txt",
      //   "track/JB00000184_8_tracking.txt",
      //   "track/JB00000184_9_tracking.txt",
      //   "track/JB00000184_10_tracking.txt",
      // ];
      const filePaths = ["track/Video_track_002.txt"];

      const fetchFiles = filePaths.map((filePath) =>
        fetch(filePath)
          .then((response) => response.text())
          .catch((error) => {
            console.error(`파일 ${filePath}을 불러오는 중 오류 발생:`, error);
            return null; // 오류 발생 시 null 반환
          })
      );

      const worker = new Worker("./worker.js");

      // Play button.
      const startButton = document.querySelector("#start");
      startButton.addEventListener(
        "click",
        () => {
          document
            .querySelectorAll("input")
            .forEach((input) => (input.disabled = true));
          // startButton.disabled = true;
          start();
        },
        { once: true }
      );

      // Mosaic canvas Event
      const captionCanvas = document.querySelector("#caption");

      captionCanvas.addEventListener("click", (e) => {
        const rect = e.target.getBoundingClientRect();
        const clickX = e.clientX - rect.left;
        const clickY = e.clientY - rect.top;
        // renderer.handleClick(clickX, clickY);
        worker.postMessage({ type: "rectClick", clickX, clickY });
      });

      captionCanvas.addEventListener("mousemove", (e) => {
        const rect = captionCanvas.getBoundingClientRect();
        const mouseX = e.clientX - rect.left;
        const mouseY = e.clientY - rect.top;
        // console.log("mouseX", mouseX, "mouseY", mouseY);
        // console.log
        worker.postMessage({ type: "rectMouseMove", mouseX, mouseY });
      });

      captionCanvas.addEventListener("mousedown", (e) => {
        const rect = captionCanvas.getBoundingClientRect();
        const mouseX = e.clientX - rect.left;
        const mouseY = e.clientY - rect.top;
        // console.log("mouseX", mouseX, "mouseY", mouseY);
        // console.log
        // captionCanvas.style.cursor = "pointer";

        worker.postMessage({ type: "rectMouseDown", mouseX, mouseY });
      });

      captionCanvas.addEventListener("mouseup", (e) => {
        const rect = captionCanvas.getBoundingClientRect();
        const mouseX = e.clientX - rect.left;
        const mouseY = e.clientY - rect.top;
        // console.log("mouseX", mouseX, "mouseY", mouseY);
        // console.log
        captionCanvas.style.cursor = "default";

        worker.postMessage({ type: "rectMouseUp", mouseX, mouseY });
        if (isTextDragging) isTextDragging = false;
      });

      // Status UI.
      const status = {
        fetch: document.querySelector("#fetch"),
        demux: document.querySelector("#demux"),
        decode: document.querySelector("#decode"),
        render: document.querySelector("#render"),
        status: document.querySelector("#status"),
        // hover: document.querySelector("#hover"),
      };

      function setStatus(message) {
        for (const key in message.data) {
          if (key === "getCursor") {
            captionCanvas.style.cursor = message.data[key];
          } else if (key === "trackData") {
            // console.log("getTrackData--->>>>>", message.data[key]);
            renderTrackData(message.data[key]);
          } else {
            status[key].innerText = message?.data?.[key] || "";
          }
        }
      }

      // Worker setup.
      function start() {
        const videoCodec = document.querySelector(
          'input[name="video_codec"]:checked'
        ).value;
        // const dataUri = `https://w3c.github.io/webcodecs/samples/data/bbb_video_${videoCodec}_frag.mp4`;
        // const dataUri = `./JB00000184.mp4`;
        const dataUri = `http://127.0.0.1:3000/video/002`;

        const rendererName = document.querySelector(
          'input[name="renderer"]:checked'
        ).value;
        const canvas = document
          .querySelector("canvas#video")
          .transferControlToOffscreen();

        const textCanvas = document
          .querySelector("canvas#caption")
          .transferControlToOffscreen();

        const mosaicCanvas = document
          .querySelector("canvas#mosaic")
          .transferControlToOffscreen();

        console.log("textCanvas", textCanvas);

        Promise.all(fetchFiles)
          .then((filesContent) => {
            // 모든 파일을 성공적으로 불러왔을 때
            console.log("filesContent-->", filesContent);
            worker.addEventListener("message", setStatus);
            worker.postMessage(
              {
                type: "start",
                dataUri,
                rendererName,
                canvas,
                textCanvas,
                mosaicCanvas,
                csvData: filesContent,
              },
              [canvas, textCanvas, mosaicCanvas]
            );
            // filesContent.forEach((content, index) => {
            //   if (content !== null) {
            //     console.log(`파일 ${filePaths[index]} 내용:`, content);
            //   }
            // });
          })
          .catch((error) => {
            console.error("파일을 불러오는 중 오류 발생:", error);
          });
      }

      function playVideo() {
        worker.postMessage({ type: "play" });
      }
      function pause() {
        worker.postMessage({ type: "pause" });
      }

      function reset() {
        worker.postMessage({ type: "reset" });
      }

      function playbackRate(rate) {
        console.log("playbackRate", rate);
        worker.postMessage({ type: "playbackRate", rate });
      }

      function seek(value) {
        console.log("seek", value);
        if (value < 0) {
          worker.postMessage({ type: "seekBackward" });
        } else {
          worker.postMessage({ type: "seekForward" });
        }
      }

      function zoneSetting() {
        worker.postMessage({ type: "zoneSetting" });
      }

      function setText() {
        const _htmlInput = `<input
        type="text"
        class="textInput"
        // id="textInput"
        placeholder="텍스트를 입력하세요"
        style="position:absolute;
              font-size: 20px;
              border: 3px solid #f00;
              background: transparent;
              font-weight: 600;
              color: #f00;
              z-index: 99;"
        />`;

        const _parentEl = document.querySelector(".video-container");
        _parentEl.insertAdjacentHTML("beforeend", _htmlInput);

        // 👇 DOM에 추가된 후에 이벤트 바인딩

        const textInputEl = document.querySelector(".textInput");
        textInputEl.style.top = "100px";
        textInputEl.style.left = "100px";
        textInputEl.addEventListener("change", (e) => {
          const textInput = e.target.value;
          console.log("textInput", textInput);

          // worker.postMessage({ type: "setText", text: textInput });
        });
        textInputEl.addEventListener("mousedown", (e) => {
          isTextDragging = true;
          textOffsetX = e.clientX - textInputEl.offsetLeft;
          textOffsetY = e.clientY - textInputEl.offsetTop;
          // e.preventDefault(); // 드래그 중 텍스트 선택 방지
        });
        textInputEl.addEventListener("mousemove", (e) => {
          if (!isTextDragging) return;
          textInputEl.style.left = `${e.clientX - textOffsetX}px`;
          textInputEl.style.top = `${e.clientY - textOffsetY}px`;
        });
        textInputEl.addEventListener("mouseup", (e) => {
          isTextDragging = false;
          // worker.postMessage({ type: "setTextClick", clickX, clickY });
        });
      }

      function getType(type) {
        let _type = "unknown";
        switch (type) {
          case 1:
            // _type = "";
            break;
          case 2:
            _type = "person";
            break;
          case 3:
            _type = "car";
            break;
          case 4:
            break;
          case 0:
            break;
          default:
            break;
        }
        return _type;
      }

      function renderTrackData(data) {
        const trackRenderEl = document.querySelector("#track-box");
        Object.keys(data).forEach((objectIndex) => {
          let _html = `<div class="trackItems" id="index-${objectIndex}">`;
          let _type = 0;
          let _index = 0;
          const indexList = data[objectIndex];
          indexList.map((item, _idx) => {
            const { timestamp, type, index } = item;
            const _left = ((timestamp / videoTimestamp) * 100).toFixed(2); // 100px = 1s
            _html += `<div class="trackItem" id="item-${objectIndex}-${timestamp}" style="left:${_left}%;"></div>`;
            if (_idx === 0) {
              _type = type;
              _index = index;
            }
          });

          _html += `<span class="trackType">${getType(
            _type
          )}-${_index}</span></div>`;
          trackRenderEl.insertAdjacentHTML("beforeend", _html);
        });
      }
    </script>
  </body>
</html>
